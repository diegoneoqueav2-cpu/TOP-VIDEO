openapi: 3.1.0
info:
  title: TOP VIDEO — Editor conversacional
  version: 1.1.0
  description: >
    Recebe um vídeo anexado à conversa, aceita um plano criado pelo próprio ChatGPT
    sem chamar a API da OpenAI, valida os tempos contra o arquivo original e renderiza
    somente após aprovação explícita.
servers:
  - url: https://YOUR-TOP-VIDEO-DOMAIN
    description: Substitua pelo domínio HTTPS real do backend TOP VIDEO.
security:
  - BearerAuth: []
paths:
  /api/jobs:
    post:
      operationId: createVideoJob
      summary: Enviar o vídeo para o motor TOP VIDEO
      description: >
        Envie exatamente um vídeo anexado nesta conversa. O ChatGPT preenche
        openaiFileIdRefs com a referência do arquivo. O backend apenas recebe e
        armazena temporariamente o vídeo; não chama nenhuma API de IA nesta operação.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openaiFileIdRefs, instruction]
              properties:
                openaiFileIdRefs:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: object
                    required: [download_link, mime_type]
                    properties:
                      name: { type: string }
                      id: { type: string }
                      mime_type:
                        type: string
                        enum: [video/mp4, video/quicktime, video/webm, video/x-matroska]
                      download_link: { type: string, format: uri }
                instruction: { type: string, maxLength: 4000 }
                aspectRatio:
                  type: string
                  enum: ["9:16", "16:9", "1:1"]
                  default: "9:16"
                approvalRequired:
                  type: boolean
                  default: true
      responses:
        "201":
          description: Vídeo recebido. Guarde jobId.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId: { type: string, format: uuid }
                  status: { type: string, example: uploaded }
                  nextStep: { type: string, example: submitEditPlan }
        "400": { description: Arquivo ou briefing inválido. }
        "401": { description: Token inválido. }
        "413": { description: Vídeo acima de 100 MB. }
        "415": { description: Formato não aceito. }
  /api/jobs/{id}/plan:
    post:
      operationId: submitEditPlan
      summary: Enviar plano de edição criado pelo ChatGPT
      description: >
        Use depois de analisar o vídeo na própria conversa. Envie um objeto editPlan
        completo no formato do schema TOP VIDEO. O servidor valida o schema, a proporção
        e todos os tempos com FFprobe. Não há chamada à API da OpenAI nem cobrança de API
        nesta operação. O plano fica aguardando aprovação humana.
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [editPlan]
              properties:
                editPlan:
                  type: object
                  description: >
                    Plano híbrido completo: version=1; mode=hybrid; aspectRatio igual ao
                    formato escolhido; fps=24|25|30|60; source.durationSeconds; analysis.summary
                    e analysis.scenes; edits; captions; graphics; audio; assetSuggestions.
                  additionalProperties: true
                transcript:
                  type: string
                  maxLength: 30000
      responses:
        "200":
          description: Plano validado e aguardando aprovação.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId: { type: string, format: uuid }
                  status: { type: string, example: awaiting_approval }
                  analysisRevision: { type: integer }
                  validation: { type: string }
                  editPlan: { type: object, additionalProperties: true }
        "409": { description: Trabalho em estado que não aceita plano. }
        "422": { description: Plano inválido, fora do schema ou com tempos incompatíveis. }
  /api/jobs/{id}:
    get:
      operationId: getVideoJob
      summary: Consultar estado do trabalho
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Estado atual.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404": { description: Trabalho não encontrado. }
  /api/jobs/{id}/approve:
    post:
      operationId: approveVideoRender
      summary: Aprovar plano e iniciar renderização
      description: Só chamar depois de o usuário aprovar explicitamente o plano.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "202":
          description: Renderização iniciada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId: { type: string, format: uuid }
                  status: { type: string, example: rendering }
        "409": { description: Não existe plano pronto para aprovação. }
  /api/jobs/{id}/file-response:
    get:
      operationId: getRenderedVideoDownload
      summary: Obter link temporário do MP4 final
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Link HTTPS assinado de download.
          content:
            application/json:
              schema:
                type: object
                properties:
                  downloadUrl: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
                  fileName: { type: string }
                  mimeType: { type: string, example: video/mp4 }
        "409": { description: Renderização ainda não terminou. }
        "503": { description: URL pública do backend não configurada. }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: TOP_VIDEO_API_TOKEN
  parameters:
    JobId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
