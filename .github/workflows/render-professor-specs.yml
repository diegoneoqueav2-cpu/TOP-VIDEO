name: Renderizar Professor Sabio - Camera Specs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/ProfessorSpecs.tsx"
      - "src/Root.tsx"
      - ".github/workflows/render-professor-specs.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Preparar navegador Remotion
        run: npx remotion browser ensure

      - name: Renderizar MP4 vertical 9:16
        run: npx remotion render src/index.ts ProfessorSpecs out/professor-camera-specs.mp4

      - name: Disponibilizar MP4 para baixar
        uses: actions/upload-artifact@v4
        with:
          name: professor-camera-specs-mp4
          path: out/professor-camera-specs.mp4
          if-no-files-found: error
          retention-days: 7
