name: Gerar história da Vaca Vitória — TOP VIDEO

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/render-demo.yml"
      - "src/CowStory.tsx"
      - "src/Root.tsx"
      - "src/index.ts"
      - "scripts/generate-cow-audio.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Instalar voz em português e FFmpeg
        run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg

      - name: Gerar narração e trilha musical
        run: node scripts/generate-cow-audio.mjs

      - name: Renderizar vídeo de demonstração
        run: npx remotion render src/index.ts CowStory out/vaca-vitoria.mp4

      - name: Disponibilizar MP4 para baixar
        uses: actions/upload-artifact@v4
        with:
          name: video-vaca-vitoria
          path: out/vaca-vitoria.mp4
          if-no-files-found: error
          retention-days: 7
