name: Gerar primeiro vídeo TOP VIDEO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Renderizar vídeo de demonstração
        run: npx remotion render src/index.ts MotionDemo out/top-video-motion-demo.mp4

      - name: Disponibilizar MP4 para baixar
        uses: actions/upload-artifact@v4
        with:
          name: top-video-motion-demo
          path: out/top-video-motion-demo.mp4
          if-no-files-found: error
          retention-days: 7
