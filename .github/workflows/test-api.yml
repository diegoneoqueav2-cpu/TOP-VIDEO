name: Testar API TOP VIDEO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Validar sintaxe e schema da análise
        run: |
          node --check server/index.mjs
          node --check server/video-analysis.mjs
          node --check server/editor-profile.mjs
          node --check server/render-worker.mjs
          npm test
          npx tsc --noEmit
          node --input-type=module -e "import { TOP_VIDEO_EDITOR_PROFILE as p } from './server/editor-profile.mjs'; if(!p.system.includes('aprovação humana') || !p.userTemplate) process.exit(1); console.log('Perfil editorial carregado')"
          node --input-type=module -e "import fs from 'node:fs'; import Ajv2020 from 'ajv/dist/2020.js'; const schema=JSON.parse(fs.readFileSync('schemas/edit-plan.schema.json','utf8')); new Ajv2020({allErrors:true,strict:false}).compile(schema); console.log('Schema de edição válido')"

      - name: Testar saúde, autenticação, upload, consulta e exclusão
        env:
          TOP_VIDEO_API_TOKEN: test-token-for-github-actions-only-123456
          PORT: 8787
          TOP_VIDEO_STORAGE: ./tmp-test-storage
        run: |
          npm run api > /tmp/top-video-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true; rm -rf tmp-test-storage' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health; then break; fi
            sleep 2
          done

          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8787/api/jobs)
          test "$code" = "401"

          printf 'TOPVIDEO-TEST-FILE' > /tmp/sample.mp4
          response=$(curl -fsS -X POST http://127.0.0.1:8787/api/jobs \
            -H "Authorization: Bearer $TOP_VIDEO_API_TOKEN" \
            -F "video=@/tmp/sample.mp4;type=video/mp4" \
            -F "instruction=Teste de recebimento" \
            -F "aspectRatio=9:16")
          job_id=$(node -e 'const x=JSON.parse(process.argv[1]); if(x.status!=="uploaded") process.exit(1); process.stdout.write(x.jobId)' "$response")

          approve_code=$(curl -s -o /tmp/approve-response.json -w "%{http_code}" -X POST "http://127.0.0.1:8787/api/jobs/$job_id/approve" -H "Authorization: Bearer $TOP_VIDEO_API_TOKEN")
          test "$approve_code" = "409"
          echo "Proteção de aprovação sem plano OK"

          analysis_code=$(curl -s -o /tmp/analysis-response.json -w "%{http_code}" -X POST "http://127.0.0.1:8787/api/jobs/$job_id/analyze" -H "Authorization: Bearer $TOP_VIDEO_API_TOKEN")
          test "$analysis_code" = "503"
          node -e 'const x=JSON.parse(require("fs").readFileSync("/tmp/analysis-response.json","utf8")); if(!x.error.includes("OPENAI_API_KEY")) process.exit(1); console.log("Proteção sem chave de IA OK")'

          curl -fsS "http://127.0.0.1:8787/api/jobs/$job_id" \
            -H "Authorization: Bearer $TOP_VIDEO_API_TOKEN" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.status!=="uploaded")process.exit(1);console.log("Consulta do trabalho OK")})'

          curl -fsS -X DELETE "http://127.0.0.1:8787/api/jobs/$job_id" \
            -H "Authorization: Bearer $TOP_VIDEO_API_TOKEN"
          echo "API smoke test concluído."
