name: Validar imagem Docker do TOP VIDEO

on:
  push:
    paths:
      - "Dockerfile"
      - "package.json"
      - "server/**"
      - "src/**"
      - ".github/workflows/docker-build.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "package.json"
      - "server/**"
      - "src/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Construir imagem de produção
        run: docker build --tag top-video-api:test .
